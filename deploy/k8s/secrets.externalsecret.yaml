apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: meta-agent-runtime-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dd-cluster-secrets
    kind: ClusterSecretStore
  target:
    name: meta-agent-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: openai_api_key
      remoteRef:
        key: dd/remote-dev/agent-secrets
        property: OPENAI_API_KEY
    - secretKey: anthropic_api_key
      remoteRef:
        key: dd/remote-dev/agent-secrets
        property: ANTHROPIC_API_KEY
    - secretKey: github_token
      remoteRef:
        key: dd/remote-dev/agent-secrets
        property: GH_PAT
    - secretKey: control_plane_token
      remoteRef:
        key: dd/remote-dev/agent-secrets
        property: SERVER_AUTH_SECRET
---
# Linear is intentionally independent from the provider/GitHub bundle. The
# volume that consumes this Secret is optional: GitHub issue execution remains
# live while the backing Linear credential is being provisioned.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: meta-agent-linear-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dd-cluster-secrets
    kind: ClusterSecretStore
  target:
    name: meta-agent-linear-secret
    creationPolicy: Owner
  data:
    - secretKey: linear_api_key
      remoteRef:
        key: dd/meta-agents-demo/linear
        property: LINEAR_API_KEY
---
# Pull authentication for the private meta-agents-demo GHCR packages. This
# reuses the cluster's GitHub credential source but never writes that value to
# the manifest or image. The credential must have read:packages in addition to
# repository access for private package pulls to succeed.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: meta-agents-ghcr-pull
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: dd-cluster-secrets
    kind: ClusterSecretStore
  target:
    name: meta-agents-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: >-
          {"auths":{"ghcr.io":{"username":"ORESoftware","password":"{{ .github_token }}","auth":"{{ printf \"ORESoftware:%s\" .github_token | b64enc }}"}}}
  data:
    - secretKey: github_token
      remoteRef:
        key: dd/remote-dev/agent-secrets
        property: GH_PAT
