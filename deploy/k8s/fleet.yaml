apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meta-agent-openai-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meta-agent-anthropic-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meta-agent-dispatcher-state
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: meta-agent-control-plane
  labels:
    app.kubernetes.io/name: meta-agent-fleet
    app.kubernetes.io/component: control-plane
spec:
  selector:
    app.kubernetes.io/name: meta-agent-fleet
  ports:
    - name: http
      port: 8787
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meta-agent-fleet
  labels:
    app.kubernetes.io/name: meta-agent-fleet
    app.kubernetes.io/part-of: meta-agents-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: meta-agent-fleet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meta-agent-fleet
        app.kubernetes.io/part-of: meta-agents-demo
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: meta-agents-ghcr-pull
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: ghcr.io/meta-agents-demo/meta-agent-control-plane:main
          imagePullPolicy: Always
          env:
            - name: META_AGENT_HTTP_ADDR
              value: 0.0.0.0:8787
            - name: META_AGENT_TCP_ADDR
              value: 127.0.0.1:8788
            - name: META_AGENT_UDP_ADDR
              value: 127.0.0.1:8789
            - name: META_AGENT_PROTECT_READ_API
              value: "true"
            - name: META_AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: meta-agent-runtime-secrets
                  key: control_plane_token
            - name: META_AGENT_LOG_JSON
              value: "true"
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: control-plane-tmp
              mountPath: /tmp

        - name: openai-runner
          image: ghcr.io/meta-agents-demo/meta-agent-runner:main
          imagePullPolicy: Always
          args: [run]
          env:
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: META_AGENT_STATE_DIR, value: /var/lib/meta-agent-runner }
            - { name: META_AGENT_RUNNER_HOME, value: /var/lib/meta-agent-runner/home }
            - { name: META_AGENT_RUNTIME_URL, value: http://127.0.0.1:8787 }
            - { name: META_AGENT_PROVIDER_ALLOWLIST, value: openai }
            - { name: META_AGENT_MAX_CONCURRENCY, value: "4" }
            - { name: META_AGENT_RESUME_PAUSED, value: "true" }
            - { name: META_AGENT_KEEP_RAW_LOGS, value: "false" }
            - { name: META_AGENT_EVENTS_ENABLED, value: "true" }
            - { name: META_AGENT_REQUIRE_EVENT_INGEST, value: "true" }
            - { name: META_AGENT_ANTHROPIC_DISCOVER_MANAGED_AGENTS, value: "false" }
            - { name: META_AGENT_MCP_PROTOCOL_VERSION, value: "2026-07-28" }
            - { name: META_AGENT_MCP_LEGACY_PROTOCOL_VERSION, value: "2025-11-25" }
            - { name: META_AGENT_MCP_ALLOWED_HOSTS, value: developers.openai.com }
            - { name: META_AGENT_MCP_SERVERS_JSON, value: '[{"name":"openai_docs","url":"https://developers.openai.com/mcp"}]' }
            - { name: OPENAI_API_KEY_FILE, value: /run/secrets/openai_api_key }
            - { name: GH_TOKEN_FILE, value: /run/secrets/github_token }
            - { name: META_AGENT_AUTH_TOKEN_FILE, value: /run/secrets/control_plane_token }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "3", memory: 4Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: runtime-secrets, mountPath: /run/secrets, readOnly: true }
            - { name: openai-state, mountPath: /var/lib/meta-agent-runner }
            - { name: openai-tmp, mountPath: /tmp }

        - name: anthropic-runner
          image: ghcr.io/meta-agents-demo/meta-agent-runner:main
          imagePullPolicy: Always
          args: [run]
          env:
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: META_AGENT_STATE_DIR, value: /var/lib/meta-agent-runner }
            - { name: META_AGENT_RUNNER_HOME, value: /var/lib/meta-agent-runner/home }
            - { name: META_AGENT_RUNTIME_URL, value: http://127.0.0.1:8787 }
            - { name: META_AGENT_PROVIDER_ALLOWLIST, value: anthropic }
            - { name: META_AGENT_MAX_CONCURRENCY, value: "4" }
            - { name: META_AGENT_RESUME_PAUSED, value: "true" }
            - { name: META_AGENT_KEEP_RAW_LOGS, value: "false" }
            - { name: META_AGENT_EVENTS_ENABLED, value: "true" }
            - { name: META_AGENT_REQUIRE_EVENT_INGEST, value: "true" }
            - { name: META_AGENT_ANTHROPIC_DISCOVER_MANAGED_AGENTS, value: "true" }
            - { name: META_AGENT_MCP_PROTOCOL_VERSION, value: "2026-07-28" }
            - { name: META_AGENT_MCP_LEGACY_PROTOCOL_VERSION, value: "2025-11-25" }
            - { name: META_AGENT_MCP_ALLOWED_HOSTS, value: developers.openai.com }
            - { name: META_AGENT_MCP_SERVERS_JSON, value: '[{"name":"openai_docs","url":"https://developers.openai.com/mcp"}]' }
            - { name: ANTHROPIC_API_KEY_FILE, value: /run/secrets/anthropic_api_key }
            - { name: GH_TOKEN_FILE, value: /run/secrets/github_token }
            - { name: META_AGENT_AUTH_TOKEN_FILE, value: /run/secrets/control_plane_token }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "3", memory: 4Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: runtime-secrets, mountPath: /run/secrets, readOnly: true }
            - { name: anthropic-state, mountPath: /var/lib/meta-agent-runner }
            - { name: anthropic-tmp, mountPath: /tmp }

        - name: task-dispatcher
          image: ghcr.io/meta-agents-demo/meta-agent-runner:main
          imagePullPolicy: Always
          command: [/usr/bin/tini, --, python3, -m, fleet.dispatcher]
          workingDir: /opt/meta-agent
          env:
            - { name: PYTHONUNBUFFERED, value: "1" }
            - { name: META_AGENT_GITHUB_ORGS, value: "apostille-me,embedded-alerts,evento-globolo,hacker-house-medellin" }
            - { name: META_AGENT_LINEAR_PROJECTS, value: "github.com/apostille-me,github.com/embedded-alerts,github.com/evento-globolo,github.com/hacker-house-medellin" }
            - { name: META_AGENT_DISPATCH_INTERVAL_SECONDS, value: "900" }
            - { name: META_AGENT_DISPATCH_LIMIT, value: "12" }
            - { name: META_AGENT_OPENAI_STATE_DIR, value: /state/openai }
            - { name: META_AGENT_ANTHROPIC_STATE_DIR, value: /state/anthropic }
            - { name: META_AGENT_DISPATCH_LEDGER, value: /state/dispatcher/ledger.json }
            - { name: GH_TOKEN_FILE, value: /run/secrets/github_token }
            - { name: LINEAR_API_KEY_FILE, value: /run/linear/linear_api_key }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: runtime-secrets, mountPath: /run/secrets, readOnly: true }
            - { name: linear-secret, mountPath: /run/linear, readOnly: true }
            - { name: openai-state, mountPath: /state/openai }
            - { name: anthropic-state, mountPath: /state/anthropic }
            - { name: dispatcher-state, mountPath: /state/dispatcher }
            - { name: dispatcher-tmp, mountPath: /tmp }
      volumes:
        - name: runtime-secrets
          secret:
            secretName: meta-agent-runtime-secrets
            defaultMode: 0400
        - name: linear-secret
          secret:
            secretName: meta-agent-linear-secret
            optional: true
            defaultMode: 0400
        - { name: openai-state, persistentVolumeClaim: { claimName: meta-agent-openai-state } }
        - { name: anthropic-state, persistentVolumeClaim: { claimName: meta-agent-anthropic-state } }
        - { name: dispatcher-state, persistentVolumeClaim: { claimName: meta-agent-dispatcher-state } }
        - { name: control-plane-tmp, emptyDir: { medium: Memory, sizeLimit: 32Mi } }
        - { name: openai-tmp, emptyDir: { medium: Memory, sizeLimit: 256Mi } }
        - { name: anthropic-tmp, emptyDir: { medium: Memory, sizeLimit: 256Mi } }
        - { name: dispatcher-tmp, emptyDir: { medium: Memory, sizeLimit: 32Mi } }
