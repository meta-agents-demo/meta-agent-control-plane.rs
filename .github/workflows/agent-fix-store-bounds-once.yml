name: DEN-1057 fix LRU cache bounds once

on:
  push:
    branches:
      - agent/den-1057-meta-agent-control-plane
    paths:
      - .github/workflows/agent-fix-store-bounds-once.yml

permissions:
  contents: write

concurrency:
  group: den-1057-store-bounds-fix
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'meta-agents-demo/meta-agent-control-plane.rs' &&
      github.ref == 'refs/heads/agent/den-1057-meta-agent-control-plane'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1057-meta-agent-control-plane
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust formatting toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply the exact LruCache key bounds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/store.rs')
          text = path.read_text(encoding='utf-8')
          old = 'fn cache_stats<K, V>(cache: &LruCache<K, V>, evictions: u64) -> CacheStats {\n'
          new = '''fn cache_stats<K, V>(cache: &LruCache<K, V>, evictions: u64) -> CacheStats
          where
              K: Hash + Eq,
          {
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one cache_stats signature, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all
          cargo fmt --all --check
          git diff --check

      - name: Commit the bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/store.rs
          git commit -m 'fix(DEN-1057): constrain cache metrics keys'
          git push origin HEAD:agent/den-1057-meta-agent-control-plane
