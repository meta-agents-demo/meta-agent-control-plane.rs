name: Publish OCI images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-meta-agent-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate exact publication head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          python3 -m unittest -v \
            tests/test_materialize_runtime_secrets.py \
            tests/test_secure_environment_cleanup.py
          python3 scripts/ci/test_workflow_contract.py

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish control plane
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/meta-agents-demo/meta-agent-control-plane"
          docker build \
            --pull \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="https://github.com/meta-agents-demo/meta-agent-control-plane.rs" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --tag "${image}:${GITHUB_SHA}" \
            --tag "${image}:main" \
            -f Dockerfile .
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:main"

      - name: Build and publish isolated agent runner
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/meta-agents-demo/meta-agent-runner"
          docker build \
            --pull \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="https://github.com/meta-agents-demo/meta-agent-control-plane.rs" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --tag "${image}:${GITHUB_SHA}" \
            --tag "${image}:main" \
            -f Dockerfile.agent-runner .
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:main"

      - name: Persist immutable release manifest
        shell: bash
        run: |
          set -euo pipefail
          control_plane="ghcr.io/meta-agents-demo/meta-agent-control-plane:${GITHUB_SHA}"
          runner="ghcr.io/meta-agents-demo/meta-agent-runner:${GITHUB_SHA}"
          control_plane_digest="$(docker buildx imagetools inspect "$control_plane" --format '{{json .Manifest}}' | jq -r .digest)"
          runner_digest="$(docker buildx imagetools inspect "$runner" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$control_plane_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$runner_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "ghcr.io/meta-agents-demo/meta-agent-control-plane@${control_plane_digest}"
          docker pull "ghcr.io/meta-agents-demo/meta-agent-runner@${runner_digest}"
          jq -n \
            --arg release_sha "$GITHUB_SHA" \
            --arg control_plane "ghcr.io/meta-agents-demo/meta-agent-control-plane@${control_plane_digest}" \
            --arg runner "ghcr.io/meta-agents-demo/meta-agent-runner@${runner_digest}" \
            '{schema_version: 1, release_sha: $release_sha, control_plane_image: $control_plane, runner_image: $runner}' \
            > release-manifest.json
          {
            echo '### Immutable release manifest'
            echo
            echo "- Release: \`$GITHUB_SHA\`"
            echo "- Control plane: \`ghcr.io/meta-agents-demo/meta-agent-control-plane@${control_plane_digest}\`"
            echo "- Runner: \`ghcr.io/meta-agents-demo/meta-agent-runner@${runner_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meta-agent-release-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
