name: Format coordination planner once

on:
  push:
    branches:
      - agent/den-1064-coordination-planner
    paths:
      - .github/workflows/format-coordination-once.yml

permissions:
  contents: write

concurrency:
  group: format-coordination-planner-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1064-coordination-planner
          persist-credentials: true
          fetch-depth: 1

      - name: Install pinned formatter
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Correct retry fixture, format, and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/coordination.rs")
          source = path.read_text(encoding="utf-8")
          stale = '''        started.occurred_at -= Duration::minutes(30);
                  store.ingest(started, Transport::Http).await.unwrap();
          '''
          replacement = '''        store.ingest(started, Transport::Http).await.unwrap();
          '''
          if stale not in source:
              raise SystemExit("expected retry fixture text was not found")
          path.write_text(source.replace(stale, replacement, 1), encoding="utf-8")
          PY
          cargo fmt --all
          rm .github/workflows/format-coordination-once.yml
          git diff --check

      - name: Commit exact formatted tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/coordination.rs src/bin/meta-agent-plan.rs tests/coordination_cli.rs .github/workflows/format-coordination-once.yml
          git commit -m 'style(DEN-1064): format coordination planner and fix retry fixture'
          git push origin HEAD:agent/den-1064-coordination-planner
