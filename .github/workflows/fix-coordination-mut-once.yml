name: Remove coordination fixture mut once

on:
  push:
    branches:
      - agent/den-1064-coordination-planner
    paths:
      - .github/workflows/fix-coordination-mut-once.yml

permissions:
  contents: write

concurrency:
  group: fix-coordination-mut-once
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1064-coordination-planner
          persist-credentials: true
          fetch-depth: 1

      - name: Remove obsolete mut and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/coordination.rs")
          source = path.read_text(encoding="utf-8")
          old = "        let mut started = EventEnvelope::new(\n"
          new = "        let started = EventEnvelope::new(\n"
          if source.count(old) != 1:
              raise SystemExit("expected exactly one obsolete mut")
          path.write_text(source.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/fix-coordination-mut-once.yml
          git diff --check

      - name: Commit corrected fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/coordination.rs .github/workflows/fix-coordination-mut-once.yml
          git commit -m 'test(DEN-1064): remove obsolete retry fixture mut'
          git push origin HEAD:agent/den-1064-coordination-planner
