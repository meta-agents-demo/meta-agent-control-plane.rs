name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate locked dependency graph
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets --all-features
      - name: Contract fixtures
        run: python scripts/verify_contract.py
      - name: Dashboard JavaScript syntax
        run: node --check scripts/dashboard.js
      - name: Conflict markers and whitespace
        run: git diff --check && ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)'
      - name: OCI build
        run: docker build -t meta-agent-control-plane:${{ github.sha }} .
