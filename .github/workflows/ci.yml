name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.8.1
        with:
          shared-key: meta-agent-control-plane

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run all Rust tests
        run: cargo test --workspace --all-targets --locked

      - name: Run checked-in protocol contract
        run: python3 scripts/verify_contract.py

      - name: Validate dashboard JavaScript syntax
        run: node --check scripts/dashboard.js

      - name: Reject whitespace errors and conflict markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git grep -nE '^(<{7}|={7}|>{7})' -- . ':!Cargo.lock'; then
            echo 'Git conflict markers are forbidden.' >&2
            exit 1
          fi

  container:
    name: OCI runtime contract
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the production image from the committed lockfile
        run: docker build --tag meta-agent-control-plane:ci .

      - name: Verify immutable image metadata
        shell: bash
        run: |
          set -euo pipefail
          image='meta-agent-control-plane:ci'
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = '10001:10001'
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$image")" = '/usr/local/bin/meta-agent-control-plane'
          test "$(docker image inspect --format '{{index .Config.Cmd 0}}' "$image")" = '--http-addr'

      - name: Boot a read-only non-root container and probe health
        shell: bash
        run: |
          set -euo pipefail
          image='meta-agent-control-plane:ci'
          container='meta-agent-control-plane-ci'
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env META_AGENT_AUTH_TOKEN='ci-runtime-token-at-least-16-bytes' \
            --env META_AGENT_PROTECT_READ_API=true \
            --publish 127.0.0.1::8787 \
            "$image" >/dev/null

          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container")" = true
          test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$container")" = '["ALL"]'
          test "$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$container")" = '["no-new-privileges"]'

          port="$(docker port "$container" 8787/tcp | sed -E 's/.*:([0-9]+)$/\1/' | head -n 1)"
          test -n "$port"

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/healthz" >/dev/null; then
              ready=true
              break
            fi
            if test "$(docker inspect --format '{{.State.Running}}' "$container")" != true; then
              docker logs "$container" >&2
              exit 1
            fi
            sleep 1
          done
          test "$ready" = true
          curl --fail --silent --show-error "http://127.0.0.1:${port}/healthz"
          curl --fail --silent --show-error "http://127.0.0.1:${port}/readyz"
