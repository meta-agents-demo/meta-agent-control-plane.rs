name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.1
        with:
          shared-key: meta-agent-control-plane

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run all Rust tests
        run: cargo test --workspace --all-targets --locked

      - name: Run checked-in protocol and dashboard contracts
        run: |
          python3 scripts/verify_contract.py
          python3 scripts/test_coordination_dashboard.py
          python3 scripts/test_explorer_dashboard.py

      - name: Validate dashboards, adapters, and provider settings
        run: |
          node --check scripts/dashboard.js
          node --check scripts/metacognition-dashboard.js
          node --check scripts/coordination-dashboard.js
          node --check scripts/explorer-dashboard.js
          node --check scripts/runtime-dashboard.js
          python3 -m py_compile \
            examples/hooks/runtime-hook.py \
            examples/hooks/agent_hook_adapter.py \
            examples/hooks/codex_app_server_proxy.py \
            examples/hooks/test_agent_hook_adapter.py
          python3 -m unittest examples/hooks/test_agent_hook_adapter.py
          python3 -m json.tool examples/hooks/claude-settings.json >/dev/null
          python3 -m json.tool examples/hooks/gemini-settings.json >/dev/null

      - name: Reject whitespace errors and conflict markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git grep -nE '^(<{7}|={7}|>{7})' -- . ':!Cargo.lock'; then
            echo 'Git conflict markers are forbidden.' >&2
            exit 1
          fi

  container:
    name: OCI runtime contract
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate hardened Compose overlays
        env:
          META_AGENT_AUTH_TOKEN: ci-compose-token-at-least-32-bytes
        run: docker compose -f compose.yaml -f compose.linux.yaml config --quiet

      - name: Build the production image from the committed lockfile
        run: docker build --tag meta-agent-control-plane:ci .

      - name: Verify immutable image metadata
        shell: bash
        run: |
          set -euo pipefail
          image='meta-agent-control-plane:ci'
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = '10001:10001'
          test "$(docker image inspect --format '{{index .Config.Entrypoint 0}}' "$image")" = '/usr/local/bin/meta-agent-control-plane'
          test "$(docker image inspect --format '{{index .Config.Cmd 0}}' "$image")" = '--http-addr'

      - name: Boot a read-only non-root container and probe real hook data
        shell: bash
        run: |
          set -euo pipefail
          image='meta-agent-control-plane:ci'
          container='meta-agent-control-plane-ci'
          token='ci-runtime-token-at-least-16-bytes'
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env META_AGENT_AUTH_TOKEN='ci-runtime-token-at-least-16-bytes' \
            --env META_AGENT_PROTECT_READ_API=true \
            --env META_AGENT_RUNTIME_DISCOVERY_ENABLED=false \
            --publish 127.0.0.1::8787 \
            "$image" >/dev/null

          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container")" = true
          test "$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$container")" = '["ALL"]'
          test "$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$container")" = '["no-new-privileges"]'

          port="$(docker port "$container" 8787/tcp | sed -E 's/.*:([0-9]+)$/\1/' | head -n 1)"
          test -n "$port"
          base="http://127.0.0.1:${port}"

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error "$base/healthz" >/dev/null; then
              ready=true
              break
            fi
            if test "$(docker inspect --format '{{.State.Running}}' "$container")" != true; then
              docker logs "$container" >&2
              exit 1
            fi
            sleep 1
          done
          test "$ready" = true
          curl --fail --silent --show-error "$base/healthz"
          curl --fail --silent --show-error "$base/readyz"
          curl --fail --silent --show-error "$base/runtime" | grep -F 'Live agent runtime' >/dev/null

          curl --fail-with-body --silent --show-error \
            -H "authorization: Bearer $token" \
            -H 'content-type: application/json' \
            --data '{
              "protocol_version":"v1",
              "event_id":"1d4d1bb7-0d6e-4d5f-b3f5-0dc84d80a416",
              "occurred_at":"2026-08-05T14:00:00Z",
              "agent":{"agent_id":"ci-claude-agent","provider":"anthropic","model":"ci-test-model"},
              "session_id":"ci-session",
              "kind":"model_response",
              "control_capable":false,
              "summary":"Completed the container runtime contract",
              "confidence":0.82,
              "cpu_percent":14.5,
              "rss_bytes":67108864,
              "memory_percent":1.25,
              "input_tokens_delta":21,
              "output_tokens_delta":8,
              "metadata":{"account_class":"ephemeral-test"}
            }' \
            "$base/api/v1/runtime/hooks" >/dev/null

          curl --fail-with-body --silent --show-error \
            -H "authorization: Bearer $token" \
            "$base/api/v1/runtime/snapshot" > runtime-snapshot.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path('runtime-snapshot.json').read_text())
          assert snapshot['collection']['enabled'] is False
          assert snapshot['totals']['agents'] == 1
          assert snapshot['totals']['hook_backed_agents'] == 1
          agent = snapshot['agents'][0]
          assert agent['agent_id'] == 'ci-claude-agent'
          assert agent['reported_confidence'] == 0.82
          assert agent['cpu_percent'] == 14.5
          assert agent['rss_bytes'] == 67108864
          assert agent['memory_percent'] == 1.25
          assert agent['resource_source'] == 'hook'
          assert agent['input_tokens'] == 21
          assert agent['output_tokens'] == 8
          assert agent['hook_backed'] is True
          assert agent['process_backed'] is False
          assert agent['control_capable'] is False
          PY
