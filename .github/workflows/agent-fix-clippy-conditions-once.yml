name: DEN-1057 collapse lifecycle conditions once

on:
  push:
    branches:
      - agent/den-1057-meta-agent-control-plane
    paths:
      - .github/workflows/agent-fix-clippy-conditions-once.yml

permissions:
  contents: write

concurrency:
  group: den-1057-collapse-lifecycle-conditions
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.repository == 'meta-agents-demo/meta-agent-control-plane.rs' &&
      github.ref == 'refs/heads/agent/den-1057-meta-agent-control-plane'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1057-meta-agent-control-plane
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust formatting toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Collapse the three equivalent lifecycle conditions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/store.rs')
          text = path.read_text(encoding='utf-8')

          prefix = "            if applied {\n                if let Some(agent) = inner.agents.get_mut(&agent_id) {\n"
          collapsed = "            if applied && let Some(agent) = inner.agents.get_mut(&agent_id) {\n"
          count = text.count(prefix)
          if count != 3:
              raise SystemExit(f'expected three nested lifecycle prefixes, found {count}')
          text = text.replace(prefix, collapsed)

          tails = [
              (
                  "                    agent.active_task_id = Some(started.task_id.clone());\n                }\n            }\n",
                  "                agent.active_task_id = Some(started.task_id.clone());\n            }\n",
              ),
              (
                  "                    agent.active_task_id = Some(progress.task_id.clone());\n                }\n            }\n",
                  "                agent.active_task_id = Some(progress.task_id.clone());\n            }\n",
              ),
              (
                  "                    reconcile_completion_counters(agent, previous_outcome, completed.outcome);\n                }\n            }\n",
                  "                reconcile_completion_counters(agent, previous_outcome, completed.outcome);\n            }\n",
              ),
          ]
          for old, new in tails:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one lifecycle tail, found {count}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo fmt --all --check
          git diff --check

      - name: Commit the semantics-preserving Clippy repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/store.rs
          git commit -m 'fix(DEN-1057): collapse lifecycle reconciliation conditions'
          git push origin HEAD:agent/den-1057-meta-agent-control-plane
