name: Format coordination planner signature once

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - .github/workflows/format-coordination-signature-once.yml

permissions:
  contents: write

concurrency:
  group: format-coordination-planner-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/den-1064-planner-ci-repair-v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact rustfmt output and remove this workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/coordination.rs')
          text = path.read_text(encoding='utf-8')
          old = """fn diagnostics_by_task(
              diagnostics: &[Diagnostic],
          ) -> BTreeMap<TaskKey, Vec<&Diagnostic>> {
          """
          new = "fn diagnostics_by_task(diagnostics: &[Diagnostic]) -> BTreeMap<TaskKey, Vec<&Diagnostic>> {\n"
          if text.count(old) != 1:
              raise SystemExit('expected exactly one rustfmt target')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/format-coordination-signature-once.yml
          test "$(git diff --name-only | LC_ALL=C sort | tr '\n' ' ')" = ".github/workflows/format-coordination-signature-once.yml src/coordination.rs "
          git diff --check
          grep -F "fn diagnostics_by_task(diagnostics: &[Diagnostic]) -> BTreeMap<TaskKey, Vec<&Diagnostic>> {" src/coordination.rs >/dev/null

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/coordination.rs .github/workflows/format-coordination-signature-once.yml
          git commit -m 'style(DEN-1064): apply rustfmt to planner signature'
          git push origin "HEAD:${HEAD_BRANCH}"
