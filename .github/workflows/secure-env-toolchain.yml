name: Secure environment toolchain

on:
  pull_request:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - justfile
      - .nix/devshell.nix
      - .github/workflows/secure-env-toolchain.yml
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - justfile
      - .nix/devshell.nix
      - .github/workflows/secure-env-toolchain.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-env-toolchain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow syntax
        shell: bash
        run: |
          docker run --rm \
            --volume "$PWD:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/secure-env-toolchain.yml

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ github.token }}

      - name: Prove pinned ores-sops and just entry point
        run: |
          test -f flake.lock
          nix develop --no-write-lock-file --command just env-ci
          git diff --exit-code -- flake.lock
