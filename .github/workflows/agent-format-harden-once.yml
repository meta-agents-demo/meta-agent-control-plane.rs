name: DEN-1057 apply formatting and lockfile once

on:
  push:
    branches:
      - agent/den-1057-meta-agent-control-plane
    paths:
      - .github/workflows/agent-format-harden-once.yml

permissions:
  contents: write

concurrency:
  group: den-1057-format-lock-apply
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'meta-agents-demo/meta-agent-control-plane.rs' &&
      github.ref == 'refs/heads/agent/den-1057-meta-agent-control-plane' &&
      github.actor == 'ORESoftware'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1057-meta-agent-control-plane
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust formatting toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Apply deterministic formatting and lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          test -s Cargo.lock
          cargo fmt --all --check
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          git diff --check

      - name: Commit the mechanical branch repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock src tests examples
          git commit -m 'fix(DEN-1057): format sources and commit the lockfile'
          git push origin HEAD:agent/den-1057-meta-agent-control-plane
