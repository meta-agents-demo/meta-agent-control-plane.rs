name: DEN-1057 one-shot formatting and CI hardening

on:
  push:
    branches:
      - agent/den-1057-meta-agent-control-plane
    paths:
      - .github/workflows/agent-format-harden-once.yml

permissions:
  contents: write

concurrency:
  group: den-1057-format-harden-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1057-meta-agent-control-plane
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy

      - name: Apply permanent product, test, and CI changes
        shell: python
        run: |
          from pathlib import Path

          auth = Path('src/auth.rs')
          text = auth.read_text(encoding='utf-8')
          old = '''    if scheme.eq_ignore_ascii_case("bearer") && !token.is_empty() {
              Some(token)
          } else {
              None
          }
          '''
          new = '''    if scheme.eq_ignore_ascii_case("bearer")
              && !token.is_empty()
              && !token.bytes().any(|byte| byte.is_ascii_whitespace())
          {
              Some(token)
          } else {
              None
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one bearer parser block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          insertion = '''

              #[test]
              fn bearer_parser_is_case_insensitive_and_rejects_whitespace() {
                  let mut headers = HeaderMap::new();
                  headers.insert(AUTHORIZATION, "bEaReR token-123".parse().unwrap());
                  assert_eq!(bearer_token(&headers), Some("token-123"));

                  for invalid in ["Basic token-123", "Bearer ", "Bearer token extra"] {
                      headers.insert(AUTHORIZATION, invalid.parse().unwrap());
                      assert_eq!(bearer_token(&headers), None, "accepted {invalid:?}");
                  }
              }

              #[test]
              fn authorization_header_precedes_query_token_and_malformed_header_falls_back() {
                  let mut headers = HeaderMap::new();
                  headers.insert(AUTHORIZATION, "Bearer header-token".parse().unwrap());
                  assert_eq!(preferred_token(&headers, Some("query-token")), Some("header-token"));

                  headers.insert(AUTHORIZATION, "Basic ignored".parse().unwrap());
                  assert_eq!(preferred_token(&headers, Some("query-token")), Some("query-token"));
              }

              #[test]
              fn unprotected_reads_do_not_disable_ingest_authentication() {
                  let mut config = Config::local_test();
                  config.auth_token = Some("a-strong-enough-token".to_owned());
                  config.protect_read_api = false;
                  let policy = AuthPolicy::from_config(&config);

                  assert!(policy.authorize_read(None).is_ok());
                  assert!(policy.authorize_ingest(None).is_err());
                  assert!(policy.ingestion_is_protected());
                  assert!(!policy.reads_are_protected());
              }

              #[test]
              fn debug_output_never_contains_the_configured_token() {
                  let mut config = Config::local_test();
                  config.auth_token = Some("do-not-log-this-token".to_owned());
                  let output = format!("{:?}", AuthPolicy::from_config(&config));

                  assert!(output.contains("token_configured: true"));
                  assert!(!output.contains("do-not-log-this-token"));
              }
          '''
          if 'fn bearer_parser_is_case_insensitive_and_rejects_whitespace' in text:
              raise SystemExit('auth regression tests already exist')
          closing = '\n}\n'
          position = text.rfind(closing)
          if position < 0:
              raise SystemExit('auth test module closing brace not found')
          text = text[:position] + insertion + text[position:]
          auth.write_text(text, encoding='utf-8')

