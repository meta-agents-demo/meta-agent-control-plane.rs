name: DEN-1057 one-shot formatting and CI hardening

on:
  push:
    branches:
      - agent/den-1057-meta-agent-control-plane
    paths:
      - .github/workflows/agent-format-harden-once.yml

permissions:
  contents: write

concurrency:
  group: den-1057-format-harden-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/den-1057-meta-agent-control-plane
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy

      - name: Format sources and create the committed lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo generate-lockfile
          test -s Cargo.lock

      - name: Validate permanent workflows and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            .github/workflows/ci.yml \
            .github/workflows/workflow-contract.yml
          python3 -m unittest -v scripts/ci/test_workflow_contract.py
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          bash tests/contract-fixtures.sh
          node --check dashboard/app.js
          docker build --tag meta-agent-control-plane:ci .
          git diff --check
          ! grep -R --line-number -E '^(<{7}|={7}|>{7})' \
            .github/workflows/ci.yml \
            .github/workflows/workflow-contract.yml \
            scripts/ci \
            src \
            tests

      - name: Commit permanent changes and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-format-harden-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix(DEN-1057): format, lock, test, and harden CI'
          git push origin HEAD:agent/den-1057-meta-agent-control-plane
