name: DEN-1057 formatting and lockfile artifact

on:
  pull_request:
    paths:
      - .github/workflows/agent-format-harden-once.yml
      - Cargo.toml
      - src/**
      - tests/**
      - dashboard/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: den-1057-format-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust formatting toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Produce deterministic formatting patch and lockfile
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          artifact_dir="${RUNNER_TEMP}/den-1057-format-lock"
          mkdir -p "$artifact_dir"
          chmod 700 "$artifact_dir"

          cargo fmt --all
          cargo generate-lockfile
          test -s Cargo.lock
          cargo metadata --locked --no-deps --format-version 1 > "$artifact_dir/cargo-metadata.json"
          git diff --binary -- . > "$artifact_dir/formatted.patch"
          git diff --name-only -- . > "$artifact_dir/formatted-files.txt"
          cp Cargo.lock "$artifact_dir/Cargo.lock"
          git diff --check

          head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          {
            printf 'head_sha=%s\n' "$head_sha"
            printf 'rustc=%s\n' "$(rustc --version)"
            printf 'cargo=%s\n' "$(cargo --version)"
            printf 'lock_sha256=%s\n' "$(sha256sum Cargo.lock | cut -d' ' -f1)"
            printf 'patch_sha256=%s\n' "$(sha256sum "$artifact_dir/formatted.patch" | cut -d' ' -f1)"
          } > "$artifact_dir/evidence.txt"

      - name: Upload formatting evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: den-1057-format-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/den-1057-format-lock/
          if-no-files-found: error
          retention-days: 3
