name: one-shot Kubernetes secret isolation

on:
  push:
    branches:
      - deploy/k8s-agent-fleet
    paths:
      - .github/workflows/apply-k8s-secret-isolation-once.yml

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out deployment branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: deploy/k8s-agent-fleet
          fetch-depth: 0
          persist-credentials: true

      - name: Apply minimum-credential volume projections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('deploy/k8s/fleet.yaml')
          value = path.read_text(encoding='utf-8')

          # There are exactly three container mounts of the old broad volume.
          expected = value.count('{ name: runtime-secrets, mountPath: /run/secrets, readOnly: true }')
          if expected != 3:
              raise SystemExit(f'expected three broad secret mounts, found {expected}')
          value = value.replace(
              '{ name: runtime-secrets, mountPath: /run/secrets, readOnly: true }',
              '{ name: openai-secrets, mountPath: /run/secrets, readOnly: true }',
              1,
          )
          value = value.replace(
              '{ name: runtime-secrets, mountPath: /run/secrets, readOnly: true }',
              '{ name: anthropic-secrets, mountPath: /run/secrets, readOnly: true }',
              1,
          )
          value = value.replace(
              '{ name: runtime-secrets, mountPath: /run/secrets, readOnly: true }',
              '{ name: dispatcher-secrets, mountPath: /run/secrets, readOnly: true }',
              1,
          )

          old = '''        - name: runtime-secrets
          secret:
            secretName: meta-agent-runtime-secrets
            defaultMode: 0400
'''
          if value.count(old) != 1:
              raise SystemExit('broad runtime Secret volume definition drifted')
          new = '''        - name: openai-secrets
          secret:
            secretName: meta-agent-runtime-secrets
            defaultMode: 0400
            items:
              - { key: openai_api_key, path: openai_api_key }
              - { key: github_token, path: github_token }
              - { key: control_plane_token, path: control_plane_token }
        - name: anthropic-secrets
          secret:
            secretName: meta-agent-runtime-secrets
            defaultMode: 0400
            items:
              - { key: anthropic_api_key, path: anthropic_api_key }
              - { key: github_token, path: github_token }
              - { key: control_plane_token, path: control_plane_token }
        - name: dispatcher-secrets
          secret:
            secretName: meta-agent-runtime-secrets
            defaultMode: 0400
            items:
              - { key: github_token, path: github_token }
'''
          path.write_text(value.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate rendered isolation
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize deploy/k8s > /tmp/meta-agent-fleet.yaml
          grep -Fq 'name: openai-secrets' /tmp/meta-agent-fleet.yaml
          grep -Fq 'name: anthropic-secrets' /tmp/meta-agent-fleet.yaml
          grep -Fq 'name: dispatcher-secrets' /tmp/meta-agent-fleet.yaml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('deploy/k8s/fleet.yaml').read_text(encoding='utf-8')
          openai = text.split('- name: openai-secrets', 1)[1].split('- name: anthropic-secrets', 1)[0]
          anthropic = text.split('- name: anthropic-secrets', 1)[1].split('- name: dispatcher-secrets', 1)[0]
          dispatcher = text.split('- name: dispatcher-secrets', 1)[1].split('- name: linear-secret', 1)[0]
          assert 'openai_api_key' in openai and 'anthropic_api_key' not in openai
          assert 'anthropic_api_key' in anthropic and 'openai_api_key' not in anthropic
          assert 'github_token' in dispatcher
          assert 'openai_api_key' not in dispatcher and 'anthropic_api_key' not in dispatcher
          assert 'control_plane_token' not in dispatcher
          PY

      - name: Commit validated isolation and remove one-use workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/fleet.yaml
          git rm .github/workflows/apply-k8s-secret-isolation-once.yml
          git commit -m "security: isolate provider and dispatcher secret projections"
          git push origin HEAD:deploy/k8s-agent-fleet
